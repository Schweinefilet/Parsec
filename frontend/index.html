<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>P4RSEC — Explore the Solar System in 3D</title>
    <meta name="description" content="An interactive 3D atlas of the solar system. Fly to every planet, moon, dwarf planet and comet, track the ISS live, and browse 70 objects with real orbital data." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- SVG first for browsers that use it (crisp at any size); favicon.ico and
         the 96px PNG are fallbacks for everything else that resolves an icon by
         well-known path or by raster size, search engines among them — see
         CHANGELOG 4.6.5. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Textures and the astronomy engine come from the same origin; warm up the
         NASA image CDN that the catalog cards pull from. -->
    <link rel="preconnect" href="https://images-assets.nasa.gov" crossorigin />
    <link rel="dns-prefetch" href="https://api.wheretheiss.at" />

    <!-- Montserrat, variable weight 300-800. Latin/Vietnamese only — Arabic
         keeps the system-font stack in index.css since Montserrat has no
         Arabic glyphs. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..800&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="P4RSEC" />
    <meta property="og:url" content="https://p4rsec.com/" />
    <meta property="og:title" content="P4RSEC — Explore the Solar System in 3D" />
    <meta property="og:description" content="Fly to every planet, moon and comet in an interactive 3D solar system. Track the ISS live and browse 70 objects with real orbital data." />
    <!-- Absolute URL: link unfurlers do not resolve relative paths. Kept in sync
         with public/og-image.png (1200×630). -->
    <meta property="og:image" content="https://p4rsec.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="P4RSEC — an interactive 3D atlas of the solar system" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="P4RSEC — Explore the Solar System in 3D" />
    <meta name="twitter:description" content="An interactive 3D atlas of the solar system, with live ISS tracking." />
    <meta name="twitter:image" content="https://p4rsec.com/og-image.png" />
    <link rel="canonical" href="https://p4rsec.com/" />

    <!-- The first paint, before a byte of the bundle has run.
         Until this existed, the opening moment of the site was an empty black
         window for as long as ~200 KB of JavaScript took to arrive and parse —
         on a slow connection, seconds of nothing at all, which reads as a page
         that has failed rather than one that is coming. This draws the same
         black the loading screen uses and one faint pulsing ring in the exact
         place its orrery appears, so when React mounts there is no seam: the
         ring is simply joined by the rest of the figure.

         Inline and tiny on purpose — it has to paint from the HTML alone, with
         no stylesheet and no script. The markup lives inside #root, so React
         removes it on mount without anyone having to remember to. -->
    <style>
      @keyframes p4-boot-pulse {
        0%, 100% { opacity: .25; transform: translate(-50%, -50%) rotateX(69deg) scale(1); }
        50%      { opacity: .5;  transform: translate(-50%, -50%) rotateX(69deg) scale(1.035); }
      }
      #p4-boot { position: fixed; inset: 0; background: #000; z-index: 1; }
      #p4-boot i {
        position: absolute; left: 50%; top: calc(50% - 58px);
        width: clamp(240px, 23vw, 286px); aspect-ratio: 1;
        border: 1px solid rgba(255,255,255,.5); border-radius: 50%;
        transform: translate(-50%, -50%) rotateX(69deg);
        animation: p4-boot-pulse 2.6s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) { #p4-boot i { animation: none; opacity: .38; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="p4-boot" aria-hidden="true"><i></i></div>
      <!-- The home view is a 3D scene with no visible heading by design, so the
           app renders a screen-reader-only <h1>. That one is client-rendered;
           this copy sits in the served HTML so a crawler that snapshots before
           the bundle runs still finds a heading. React replaces the whole of
           #root on mount, so the two never coexist. -->
      <h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">P4RSEC — an interactive 3D atlas of the solar system</h1>
    </div>
    <noscript>
      <div style="padding:32px;font-family:system-ui,sans-serif;color:#fff;background:#000;min-height:100vh">
        <h1>P4RSEC</h1>
        <p>P4RSEC renders the solar system in 3D and needs JavaScript enabled.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

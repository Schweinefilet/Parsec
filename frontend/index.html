    <title>Parsec — Explore the Solar System in 3D</title>
    <meta name="description" content="An interactive 3D atlas of the solar system. Fly to every planet, moon, dwarf planet and comet, track the ISS live, and browse 70 objects with real orbital data." />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Parsec" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Parsec — Explore the Solar System in 3D" />
    <meta name="twitter:description" content="An interactive 3D atlas of the solar system, with live ISS tracking." />

    <div id="root"></div>
    <noscript>
      <div style="padding:32px;font-family:system-ui,sans-serif;color:#fff;background:#000;min-height:100vh">
